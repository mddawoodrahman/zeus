<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zeus Adapter Harness - Claude</title>
  <link rel="stylesheet" href="./harness.css" />
</head>
<body>
  <main>
    <section class="card">
      <h1>Claude Adapter Harness</h1>
      <p>Validates selector matching and candidate input discovery for the Claude adapter.</p>
      <div class="toolbar">
        <button id="run-checks">Run Checks</button>
      </div>
    </section>

    <section class="grid">
      <section class="card">
        <h2>Mock DOM</h2>
        <div role="textbox" contenteditable="true" class="harness-input">Type prompt here</div>
        <textarea class="harness-input" placeholder="Secondary editable input"></textarea>
      </section>
      <section class="card">
        <h2>Results</h2>
        <ul id="results"></ul>
      </section>
    </section>
  </main>

  <script src="../../core/domUtils.js"></script>
  <script src="../../adapters/claude.js"></script>
  <script>
    window.__ZEUS_HARNESS__ = {
      adapterId: 'claude',
      testHostname: 'claude.ai',
      minEligible: 1
    };
  </script>
  <script src="./harness.js"></script>
</body>
</html>
