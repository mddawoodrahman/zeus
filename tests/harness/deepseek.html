<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeus composer fixture – deepseek</title>
<link rel="stylesheet" href="/harness.css">
<main>
  <nav><label>Search history <input type="search"></label></nav>
  <h1>deepseek composer</h1>
  <form aria-label="Compose message">
    <textarea data-testid="chat-input" placeholder="Message DeepSeek"></textarea>
    <div role="toolbar" aria-label="Message actions">
      <button type="button" aria-label="Attach file">＋</button>
      <button type="button" aria-label="Model selector">Model</button>
      <button type="button" aria-label="Microphone">Mic</button>
      <button type="submit" aria-label="Send message">Send</button>
    </div>
  </form>
</main>
<script src="/harness.js"></script>
</html>
