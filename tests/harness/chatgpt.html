<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zeus Adapter Harness - ChatGPT</title>
  <link rel="stylesheet" href="./harness.css" />
</head>
<body>
  <main>
    <section class="card">
      <h1>ChatGPT Adapter Harness</h1>
      <p>Validates selector matching and candidate input discovery for the ChatGPT adapter.</p>
      <div class="toolbar">
        <button id="run-checks">Run Checks</button>
      </div>
    </section>

    <section class="grid">
      <section class="card">
        <h2>Mock DOM</h2>
        <textarea id="prompt-textarea" class="harness-input" placeholder="ChatGPT primary prompt"></textarea>
        <textarea data-id="root" class="harness-input" placeholder="Alternate prompt root"></textarea>
      </section>
      <section class="card">
        <h2>Results</h2>
        <ul id="results"></ul>
      </section>
    </section>
  </main>

  <script src="../../core/domUtils.js"></script>
  <script src="../../adapters/chatgpt.js"></script>
  <script>
    window.__ZEUS_HARNESS__ = {
      adapterId: 'chatgpt',
      testHostname: 'chatgpt.com',
      minEligible: 1
    };
  </script>
  <script src="./harness.js"></script>
</body>
</html>
