<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEUS — Prompt Enhancement System</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="zeus-ui">
  <div class="zeus-popup">
    <div class="zeus-crt-overlay"></div>
    
    <!-- Header -->
    <header class="popup-header">
      <div class="logo">
        <span class="logo-text">ZEUS</span>
        <span class="logo-version">v2.0</span>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span class="status-text typing-cursor">SYSTEM ONLINE</span>
      </div>
    </header>

    <main class="main-content">
      <!-- Provider Selection -->
      <section class="zeus-terminal-card" data-variant="cyan">
        <div class="card-accent"></div>
        <label class="zeus-label" for="aiProvider">/// TARGET PROVIDER</label>
        <select class="zeus-input zeus-select" id="aiProvider">
          <option value="gemini">Gemini</option>
          <option value="openai">OpenAI</option>
          <option value="claude">Claude</option>
          <option value="openrouter">OpenRouter</option>
          <option value="ollama">Ollama (Local)</option>
          <option value="auto">Auto (Smart Routing)</option>
        </select>
        <p id="provider-help-text" class="helper-text"></p>
      </section>

      <!-- Model Selection (conditional) -->
      <section class="zeus-terminal-card" data-variant="yellow" id="model-selection">
        <div class="card-accent"></div>
        <label class="zeus-label">/// LOADOUT MODEL</label>
        
        <div class="model-picker" id="modelPicker">
          <button
            id="modelPickerTrigger"
            class="model-picker-trigger"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="modelPickerPanel"
          >
            <span class="model-picker-trigger-main">
              <span id="selectedModelText" class="selected-model-text">Select a model</span>
              <span id="selectedModelBadge" class="selected-model-badge" style="display:none;"></span>
            </span>
            <span class="model-picker-chevron" aria-hidden="true">▾</span>
          </button>

          <div id="modelPickerPanel" class="model-picker-panel" role="listbox" aria-label="Available models" hidden>
            <div class="model-search-wrap">
              <input
                id="modelSearchInput"
                class="model-search-input"
                type="text"
                placeholder="Search models..."
                autocomplete="off"
              >
            </div>
            <div id="modelOptionGroups" class="model-option-groups"></div>
            <p id="modelEmptyState" class="model-empty-state" hidden>No models match your search.</p>
          </div>
        </div>

        <select id="providerModel" class="model-native-select" aria-hidden="true" tabindex="-1"></select>

        <div id="model-meta" class="model-meta" style="display: none;">
          <div class="model-title-row">
            <span id="model-display-name" class="model-display-name"></span>
            <span id="model-badge" class="model-badge"></span>
          </div>
          <p id="model-help-text" class="helper-text"></p>
          <div id="model-tags" class="model-tags"></div>
        </div>
      </section>

      <!-- API Key Inputs (grouped under ACCESS TOKEN card) -->
      <section class="zeus-terminal-card" data-variant="red" id="key-section">
        <div class="card-accent"></div>
        <label class="zeus-label">/// ACCESS TOKEN</label>
        
        <div id="gemini-settings" class="api-settings">
          <p>ENTER GEMINI KEY:</p>
          <div class="input-group">
            <input type="password" class="zeus-input" id="geminiApiKey" placeholder="ENTER_KEY_...">
            <button id="showHideGemini" type="button">Show</button>
          </div>
        </div>

        <div id="openai-settings" class="api-settings" style="display: none;">
          <p>ENTER OPENAI KEY:</p>
          <div class="input-group">
            <input type="password" class="zeus-input" id="openaiApiKey" placeholder="ENTER_KEY_...">
            <button id="showHideOpenAI" type="button">Show</button>
          </div>
        </div>

        <div id="claude-settings" class="api-settings" style="display: none;">
          <p>ENTER CLAUDE KEY:</p>
          <div class="input-group">
            <input type="password" class="zeus-input" id="claudeApiKey" placeholder="ENTER_KEY_...">
            <button id="showHideClaude" type="button">Show</button>
          </div>
        </div>

        <div id="openrouter-settings" class="api-settings" style="display: none;">
          <p>ENTER OPENROUTER KEY:</p>
          <div class="input-group">
            <input type="password" class="zeus-input" id="openrouterApiKey" placeholder="ENTER_KEY_...">
            <button id="showHideOpenRouter" type="button">Show</button>
          </div>
        </div>
        
        <div id="status" class="status"></div>
      </section>

      <!-- Ollama Config -->
      <section class="zeus-terminal-card" data-variant="green" id="ollama-settings" style="display:none;">
        <div class="card-accent"></div>
        <label class="zeus-label">/// LOCAL HOST</label>
        <input type="text" class="zeus-input" id="ollamaHost" value="http://localhost:11434">
        <label class="zeus-label" style="margin-top:8px">/// MODEL ID</label>
        <input type="text" class="zeus-input" id="ollamaModel" placeholder="llama2">
        <p id="ollama-suggestions" class="helper-text"></p>
      </section>

      <!-- Auto Config -->
      <section class="zeus-terminal-card" data-variant="green" id="auto-settings" style="display:none;">
        <div class="card-accent"></div>
        <label class="zeus-label">/// AUTOPILOT HUD</label>
        <p>Auto mode uses prompt-aware smart routing.</p>
        <p style="margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px;">
          Coding &rarr; GPT-5 Codex<br>
          Long-form &rarr; Claude Sonnet<br>
          Cheap &rarr; Gemini Flash
        </p>
      </section>

      <!-- Advanced Feature Access -->
      <section class="zeus-terminal-card" data-variant="cyan">
        <div class="card-accent"></div>
        <label class="zeus-label">/// ADVANCED MODULES</label>
        
        <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <label style="font-size: 11px; font-family: 'Rajdhani', sans-serif; font-weight: 600; cursor: pointer; margin: 0;" for="sidePanelEnabled">SIDE PANEL WORKBENCH</label>
            <input type="checkbox" id="sidePanelEnabled" style="cursor: pointer;">
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px;">
            <label style="font-size: 11px; font-family: 'Rajdhani', sans-serif; font-weight: 600; cursor: pointer; margin: 0;" for="copilotEnabled">COPILOT INLINE SUGGEST</label>
            <input type="checkbox" id="copilotEnabled" style="cursor: pointer;">
          </div>
        </div>
      </section>
    </main>

    <!-- Actions -->
    <footer class="popup-footer">
      <button class="zeus-btn zeus-btn-yellow" id="saveBtn">EXECUTE CONFIG</button>
      <button class="zeus-btn zeus-btn-ghost" id="resetBtn">PURGE DATA</button>
    </footer>

    <!-- Telemetry / Status Bar -->
    <div class="popup-statusbar">
      <span>LATENCY: <span id="latency">--</span>ms</span>
      <span>|</span>
      <span>FALLBACKS: <span id="fallbackCount">0</span></span>
    </div>
  </div>
  
  <script src="model-registry.js"></script>
  <script src="settings/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
